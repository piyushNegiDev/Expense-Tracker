<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>💸 Expense Tracker</h1>
      <div class="totalExpense">
        <p>Total Expense</p>
        <h2 id="totalExpense">₹0</h2>
      </div>
      <div class="inputs">
        <input type="text" placeholder="Expense title" id="expenseTitle" />
        <input type="number" min="1" placeholder="Amount" id="expenseAmount" />
        <select name="" id="inputOptions">
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
        </select>
        <input type="date" id="expenseDate" />
        <a href="#expenseDisplay">
          <button id="addExpenseBtn" class="addExpenseBtn">Add Expense</button>
        </a>
      </div>
    </div>

    <div id="expenseDisplay" class="expenseDisplay">
      <h1>🧾 Expenses</h1>
      <div class="categoriesDateFilter">
        <select name="" id="filterOptions">
          <option value="allCategories">All Categories</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
        </select>

        <input type="month" id="month" />
      </div>

      <div id="expenses" class="expenses"></div>
    </div>

    <script src="scripts/utils.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/eventHandlers.js"></script>
    <script src="scripts/uiHandling.js"></script>
  </body>
</html>
